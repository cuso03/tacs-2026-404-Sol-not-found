services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000/api
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
        - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}
        - VITE_OTEL_ENABLED=true
        - VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:4318/v1/traces
    container_name: tacs-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: tacs-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - CORS_ORIGINS=http://localhost:5173,https://tacs-2026-404-sol-not-found.onrender.com
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - MONGODB_URI=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-root}@mongo:27017/${MONGO_DATABASE:-solnotfound}?authSource=admin
      - LEGACY_WEATHER_URL=http://legacy-weather:8080
      - LEGACY_WEATHER_TOKEN=${LEGACY_WEATHER_TOKEN:-${SESSION_TOKEN:-}}
    depends_on:
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
      legacy-weather:
        condition: service_started

  legacy-weather:
    build:
      context: ./legacy-weather
    container_name: tacs-legacy-weather
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./legacy-weather/token.json
        target: /root/.config/tacs/token.json
        bind:
          create_host_path: false

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  mongo:
    image: mongo:8
    container_name: tacs-mongo
    command: ["--quiet"]
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-root}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-solnotfound}
      - GLIBC_TUNABLES=${MONGO_GLIBC_TUNABLES:-}
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-root}", "-p", "${MONGO_PASSWORD:-root}", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
